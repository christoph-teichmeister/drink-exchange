name: CI Frontend

on:
  pull_request:
  push:
    branches: [develop]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run SvelteKit sync
        run: pnpm sync

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Validate PWA output
        run: |
          set -euo pipefail
          test -f .svelte-kit/output/client/manifest.webmanifest
          test -f .svelte-kit/output/client/service-worker.js
          # Exactly one service worker: no leftover Workbox/vite-plugin-pwa output.
          if ls .svelte-kit/output/client/sw.js .svelte-kit/output/client/workbox-*.js >/dev/null 2>&1; then
            echo "Unexpected second service worker in build output"
            exit 1
          fi
