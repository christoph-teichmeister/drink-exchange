name: CI Frontend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: 22
          lockfile: frontend/pnpm-lock.yaml

      - name: Activate pinned pnpm version
        run: corepack prepare pnpm@10.26.2 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Run SvelteKit sync
        run: pnpm sync
        working-directory: frontend

      - name: Run lint
        run: pnpm lint
        working-directory: frontend

      - name: Run tests
        run: pnpm test
        working-directory: frontend

      - name: Build frontend
        run: pnpm build
        working-directory: frontend

      - name: Validate PWA output
        run: |
          cd frontend
          test -f .svelte-kit/output/client/manifest.webmanifest
          pwafiles=(
            .svelte-kit/output/client/sw.js
            .svelte-kit/output/client/service-worker.js
            .svelte-kit/output/client/service-worker.mjs
          )
          found=false
          for file in "${pwafiles[@]}"; do
            if [ -f "$file" ]; then
              found=true
              break
            fi
          done

          if [ "$found" != true ]; then
            echo "Service worker file missing from build output"
            exit 1
          fi
