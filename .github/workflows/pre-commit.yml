name: pre-commit

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  run-pre-commit:
    name: Run shared pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache pre-commit and pip artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pre-commit
            ~/.cache/pip
          key: pre-commit-${{ runner.os }}-${{ hashFiles('backend/pyproject.toml', 'frontend/pnpm-lock.yaml') }}
          restore-keys: |
            pre-commit-${{ runner.os }}-

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: 3.13

      - name: Install pnpm globally
        run: npm install -g pnpm

      - name: Set up Node 22 and pnpm cache
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enable pnpm 10
        run: corepack enable pnpm@10.26.2

      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

      - name: Explain coverage
        run: |
          echo "This workflow runs pre-commit --all-files so every push or PR sees the same hooks defined in docs/tickets/setup/06-pre-commit-hooks.md."
          echo "Backend (docs/tickets/setup/07-ci-backend.md) and frontend (docs/tickets/setup/08-ci-frontend.md) CI continue to run their dedicated lint/build/test commands, so they do not repeat this shared pre-commit step."

      - name: Run pre-commit hooks
        run: pre-commit run --all-files --show-diff-on-failure
