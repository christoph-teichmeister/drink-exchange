name: Setup Node & pnpm
description: Installs pnpm (version from frontend/package.json `packageManager`) and Node.js with the pnpm store cached.
inputs:
  node-version:
    description: Node.js version to install.
    required: false
    default: '22'
runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6
      with:
        package_json_file: frontend/package.json
    - name: Setup Node.js
      uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        cache: pnpm
        cache-dependency-path: frontend/pnpm-lock.yaml
