name: Setup Python & UV
description: Bootstraps a Python runtime with uv tooling and shared caches.
inputs:
  python-version:
    description: Python version to install.
    required: false
    default: '3.13'
  cache-paths:
    description: |-
      Newline-separated paths that feed the cache key for pip and uv artifacts.
    required: true
  cache-prefix:
    description: Prefix used for the cache key.
    required: false
    default: pip-uv
  sync-dir:
    description: Directory where `uv sync --frozen` should be run; leave empty to skip.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Setup Python interpreter
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Cache pip and uv artifacts
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/pip
          ~/.cache/uv
        key: ${{ inputs.cache-prefix }}-${{ runner.os }}-${{ hashFiles(inputs.cache-paths) }}
        restore-keys: |
          ${{ inputs.cache-prefix }}-${{ runner.os }}-
    - name: Install uv runtime
      run: |
        python -m pip install --upgrade pip
        python -m pip install uv
      shell: bash
    - name: Synchronize dependencies
      if: inputs.sync-dir != ''
      run: uv sync --frozen
      working-directory: ${{ inputs.sync-dir }}
      shell: bash
