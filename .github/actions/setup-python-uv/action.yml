name: Setup Python & uv
description: Installs Python and uv with a cache keyed on the backend lockfile, then optionally syncs dependencies.
inputs:
  python-version:
    description: Python version to install.
    required: false
    default: '3.13'
  sync-dir:
    description: Directory where `uv sync --frozen` should be run; leave empty to skip.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Install uv and Python
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ inputs.python-version }}
        enable-cache: true
        cache-dependency-glob: backend/uv.lock
    - name: Synchronize dependencies
      if: inputs.sync-dir != ''
      run: uv sync --frozen
      working-directory: ${{ inputs.sync-dir }}
      shell: bash
