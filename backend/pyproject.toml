[build-system]
requires = ["setuptools>=65.5.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drink-exchange-backend"
version = "0.1.0"
description = "Backend foundation for Drink Exchange built on Django, Channels, and uv tooling."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
authors = [ { name = "Drink Exchange" } ]
dependencies = [
    "Django>=6.1,<7",
    "channels>=4.3,<5",
    "daphne>=4.2,<5",
    "channels-redis>=4.3,<5",
    "celery>=5.6,<6",
    "dj-database-url>=3.1,<4",
    "django-cors-headers>=4.9,<5",
    "psycopg[binary]>=3.3,<4",
    "redis>=8,<9",
    "whitenoise>=6.12,<7",
    "uvicorn[standard]>=0.53,<1",
    "websockets>=17,<18",
    "python-dotenv>=1.2,<2",
    "ambient-toolbox>=12.13,<13",
]

[dependency-groups]
dev = [
    "ruff>=0.16,<0.17",
    "pytest>=9,<10",
    "pytest-django>=4.14,<5",
    "pytest-asyncio>=1.4,<2",
]

[tool.setuptools.packages.find]
include = ["api*", "bars*", "config*", "events*", "market*"]
exclude = ["tests*"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".cache",
    ".cache/**",
    ".ruff_cache",
    ".ruff_cache/**",
    "__pypackages__",
    "__pypackages__/**",
    ".venv",
    ".venv/**",
]

[tool.ruff.lint]
select = ["E", "F", "W", "C90", "I"]
ignore = ["E203"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--reuse-db"
django_find_project = false
