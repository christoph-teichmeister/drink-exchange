repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v8.52.0
    hooks:
      - id: eslint
        name: eslint (frontend)
        files: "^frontend/.*\\.(js|ts|svelte)$"
        args: [ "--max-warnings=0", "--config", "frontend/.eslintrc.cjs" ]
        additional_dependencies:
          - eslint@8.52.0
          - eslint-config-prettier@9.0.0
          - eslint-plugin-svelte@3.13.1
          - svelte@4.0.0

  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.0.0
    hooks:
      - id: prettier
        name: prettier (frontend)
        files: "^frontend/.*\\.(svelte|ts|js|css|json|md|html)$"
        additional_dependencies:
          - prettier@3.0.0
          - prettier-plugin-svelte@3.0.0

  - repo: local
    hooks:
      - id: ruff
        name: ruff (backend)
        entry: uv run ruff
        language: system
        args: ["check", "--config=backend/pyproject.toml", "--fix"]
        files: "^backend/.*\\.py$"
      - id: ruff-format
        name: ruff-format (backend)
        entry: uv run ruff
        language: system
        args: ["format", "--config=backend/pyproject.toml"]
        files: "^backend/.*\\.py$"
      - id: markdownlint
        name: markdownlint (docs)
        entry: markdownlint
        language: node
        additional_dependencies:
          - markdownlint-cli@0.36.0
        files: "\\.(md|mdx)$"
