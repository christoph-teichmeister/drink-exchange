repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
        exclude: "^frontend/tsconfig\\.json$"
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-format
      - id: ruff
        args: [ --fix, --exit-non-zero-on-fix ]

  # Frontend hooks run the versions pinned in frontend/package.json (requires `pnpm install` in frontend/).
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        language: system
        files: "^frontend/.*\\.(js|ts|svelte)$"
        entry: bash -c 'cd frontend && pnpm exec eslint --max-warnings=0 "${@#frontend/}"' --
      - id: prettier
        name: prettier (frontend)
        language: system
        files: "^frontend/.*\\.(svelte|ts|js|css|json|html)$"
        exclude: "^frontend/pnpm-lock\\.yaml$"
        entry: bash -c 'cd frontend && pnpm exec prettier --write "${@#frontend/}"' --

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
